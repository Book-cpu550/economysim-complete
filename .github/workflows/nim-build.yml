name: Build NVIDIA NIM edition

on:
  push:
    branches: [main, feat/nvidia-nim]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test the patched release
        run: python3 build.py --test
      - uses: actions/upload-artifact@v4
        with:
          name: economysim-complete-nim-mc26.2
          path: dist/*.jar
          if-no-files-found: error
